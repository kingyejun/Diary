<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나르샵 — 롤 계정 상점</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img class="float a" src="assets/star.svg" alt="">
  <img class="float b" src="assets/slime.svg" alt="">

  <div class="awning"></div>
  <header class="topbar">
    <a class="sign" href="#shop"><img src="assets/mascot.svg" alt=""><span>나르샵</span></a>
    <nav class="nav" id="nav">
      <a href="#shop" data-r="shop">상점</a>
      <a href="#charge" data-r="charge">충전</a>
      <a href="#me" data-r="me">내 정보</a>
    </nav>
    <div class="userbox" id="userbox"></div>
  </header>

  <main>
    <section class="hero">
      <img class="m" src="assets/mascot.svg" alt="나르샵 마스코트">
      <div>
        <div class="bubble">어서오세요~ 구경하고 가세요!</div>
        <h1>나르샵에 오신 걸 환영해요</h1>
        <p>충전하고, 마음에 드는 계정을 골라 바로 받아가세요.</p>
      </div>
      <img class="slime" src="assets/slime.svg" alt="">
    </section>

    <div id="setupWarn" class="setup-warn" hidden>
      <b>설정이 아직 안 끝났어요.</b> <code>js/config.js</code>에 Firebase 설정값을 넣어 주세요. (README 참고)
    </div>

    <!-- 상점 -->
    <section id="shop">
      <div class="shelf-title"><img src="assets/star.svg" alt=""><h2>판매 중인 계정</h2></div>
      <div class="filters">
        <input id="q" type="search" placeholder="검색 (제목, 설명)">
        <select id="fTier"><option value="">전체 티어</option></select>
        <select id="fSort">
          <option value="new">최신순</option>
          <option value="low">가격 낮은순</option>
          <option value="high">가격 높은순</option>
        </select>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <!-- 충전 -->
    <section id="charge" hidden>
      <div class="panel">
        <h2>충전하기</h2>
        <div class="bankbox" id="bankbox"></div>
        <p class="note">입금 후 아래에서 충전 요청을 보내면, 관리자가 확인하는 대로 잔액이 충전돼요.</p>
        <form class="form" id="chargeForm">
          <div class="field"><label>충전 금액</label><input id="cAmount" type="number" step="1000" required>
            <div class="presets" id="presets"></div></div>
          <div class="field"><label>입금자명</label><input id="cName" maxlength="20" required></div>
          <button class="btn pink" type="submit">충전 요청 보내기</button>
        </form>
      </div>
      <div class="panel"><h2>내 충전 요청</h2><div class="list" id="chargeList"></div></div>
    </section>

    <!-- 내 정보 -->
    <section id="me" hidden>
      <div class="panel"><h2>내 정보</h2><div id="meInfo"></div></div>
      <div class="panel"><h2>구매 내역</h2><div class="list" id="orderList"></div></div>
    </section>
  </main>

  <footer>
    <img src="assets/mascot.svg" alt=""> 나르샵 · <a id="discordLink" href="#" target="_blank" rel="noopener">디스코드 문의</a><br>
    나르샵은 Riot Games와 관련 없는 비공식 상점이에요.
  </footer>

  <dialog id="dlg"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
