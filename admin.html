<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>나르샵 — 사장님 창고</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="awning"></div>
  <header class="topbar">
    <a class="sign" href="index.html"><img src="assets/mascot.svg" alt=""><span>사장님 창고</span></a>
    <nav class="nav" id="nav" hidden>
      <a href="#add" data-r="add">재고 등록</a>
      <a href="#stock" data-r="stock">재고 목록</a>
      <a href="#charges" data-r="charges">충전 요청</a>
      <a href="#members" data-r="members">회원</a>
      <a href="#orders" data-r="orders">판매 내역</a>
    </nav>
    <div class="userbox"><a class="btn ghost small" href="index.html" style="text-decoration:none">상점 보기</a>
      <button class="btn ghost small" id="btnLogout" hidden>로그아웃</button></div>
  </header>

  <main>
    <section id="gate" class="panel" style="max-width:460px;margin:30px auto">
      <h2>관리자 로그인</h2>
      <form class="form" id="loginForm" style="max-width:none">
        <div class="field"><label>이메일</label><input name="email" type="email" required></div>
        <div class="field"><label>비밀번호</label><input name="pw" type="password" required></div>
        <button class="btn pink" type="submit">들어가기</button>
      </form>
      <p class="note" id="gateMsg"></p>
    </section>

    <div id="app" hidden>
      <section id="add" class="panel">
        <h2>재고 등록</h2>
        <p class="note">로그인 정보(아이디/비밀번호)는 구매한 사람에게만 공개돼요. 상점 화면에는 보이지 않아요.</p>
        <form class="form" id="addForm" style="max-width:640px">
          <div class="field"><label>상품 제목</label><input name="title" maxlength="60" placeholder="예) 골드 4 / 챔피언 80 / 스킨 40" required></div>
          <div class="field"><label>티어</label><select name="tier" id="tierSel"></select></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
            <div class="field"><label>레벨</label><input name="level" type="number" min="0"></div>
            <div class="field"><label>챔피언 수</label><input name="champs" type="number" min="0"></div>
            <div class="field"><label>스킨 수</label><input name="skins" type="number" min="0"></div>
          </div>
          <div class="field"><label>가격(원)</label><input name="price" type="number" min="0" step="100" required></div>
          <div class="field"><label>설명 (손님에게 보여요)</label><textarea name="desc" maxlength="500"></textarea></div>
          <div class="field"><label>로그인 아이디</label><input name="loginId" autocomplete="off" required></div>
          <div class="field"><label>로그인 비밀번호</label><input name="loginPw" autocomplete="off" required></div>
          <div class="field"><label>비공개 메모 (구매자에게만 보여요)</label><textarea name="note"></textarea></div>
          <button class="btn pink" type="submit">진열하기</button>
        </form>
      </section>

      <section id="stock" class="panel" hidden><h2>재고 목록</h2><div class="list" id="stockList"></div></section>
      <section id="charges" class="panel" hidden><h2>충전 요청</h2><div class="list" id="chargeList"></div></section>
      <section id="members" class="panel" hidden><h2>회원</h2><div class="table-wrap" id="memberList"></div></section>
      <section id="orders" class="panel" hidden><h2>판매 내역</h2><div class="table-wrap" id="orderList"></div></section>
    </div>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
